name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PAT_FOR_CROSS_ORG_GH || github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@v1.43.7
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ secrets.PAT_FOR_CROSS_ORG_GH || github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
