#
# Template updates are OFF since 2026-10-19 (The-Traide/statuspage): these workflows read the org
# secret PAT_FOR_CROSS_ORG_GH, which every other Traide repo uses, and Upptime's template hard-codes
# GH_PAT, so a template update would undo that. Edit these files by hand, and bump
# upptime/uptime-monitor by hand to upgrade.
